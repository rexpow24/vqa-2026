<rect x="100" y="245" width="490" height="455" rx="20" fill="#354355" stroke="#607287" stroke-width="3"/><rect x="112" y="257" width="466" height="50" rx="12" fill="#192a3d"/><text x="345.0" y="291" text-anchor="middle" fill="#f2f6fa" font-size="20" font-weight="850">K08 • LẤN QUA TIM ĐƯỜNG</text><rect x="610" y="245" width="490" height="455" rx="20" fill="#354355" stroke="#607287" stroke-width="3"/><rect x="622" y="257" width="466" height="50" rx="12" fill="#192a3d"/><text x="855.0" y="291" text-anchor="middle" fill="#f2f6fa" font-size="20" font-weight="850">K09 • ĐI NGƯỢC CHIỀU SẴN</text><path d="M345 323 V685" stroke="#d7e1ea" stroke-width="5" stroke-dasharray="19 16"/><path d="M855 323 V685" stroke="#d7e1ea" stroke-width="5" stroke-dasharray="19 16"/><g transform="translate(250 455) rotate(0) scale(1.0)"><rect x="-42" y="-68" width="84" height="136" rx="19" fill="#ffb84d" stroke="#f7fbff" stroke-width="5"/><rect x="-30" y="-38" width="60" height="42" rx="8" fill="#dcedfb" opacity=".92"/><rect x="-28" y="18" width="56" height="27" rx="7" fill="#152334" opacity=".88"/><text x="0" y="9" text-anchor="middle" font-size="30" font-weight="900" fill="#122033">A</text></g><g transform="translate(430 580) rotate(180) scale(1.0)"><rect x="-42" y="-68" width="84" height="136" rx="19" fill="#58a6ff" stroke="#f7fbff" stroke-width="5"/><rect x="-30" y="-38" width="60" height="42" rx="8" fill="#dcedfb" opacity=".92"/><rect x="-28" y="18" width="56" height="27" rx="7" fill="#152334" opacity=".88"/><text x="0" y="9" text-anchor="middle" font-size="30" font-weight="900" fill="#122033">B</text></g><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ff667a"/></marker></defs><path d="M255,500 L400,545" fill="none" stroke="#ff667a" stroke-width="7" marker-end="url(#arr)" stroke-linecap="round"/><g transform="translate(940 435) rotate(180) scale(1.0)"><rect x="-42" y="-68" width="84" height="136" rx="19" fill="#ffb84d" stroke="#f7fbff" stroke-width="5"/><rect x="-30" y="-38" width="60" height="42" rx="8" fill="#dcedfb" opacity=".92"/><rect x="-28" y="18" width="56" height="27" rx="7" fill="#152334" opacity=".88"/><text x="0" y="9" text-anchor="middle" font-size="30" font-weight="900" fill="#122033">A</text></g><g transform="translate(770 595) rotate(0) scale(1.0)"><rect x="-42" y="-68" width="84" height="136" rx="19" fill="#58a6ff" stroke="#f7fbff" stroke-width="5"/><rect x="-30" y="-38" width="60" height="42" rx="8" fill="#dcedfb" opacity=".92"/><rect x="-28" y="18" width="56" height="27" rx="7" fill="#152334" opacity=".88"/><text x="0" y="9" text-anchor="middle" font-size="30" font-weight="900" fill="#122033">B</text></g><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ff667a"/></marker></defs><path d="M940,490 L940,550" fill="none" stroke="#ff667a" stroke-width="7" marker-end="url(#arr)" stroke-linecap="round"/>
<text x="1220" y="242" fill="#58a6ff" font-size="25" font-weight="800" letter-spacing="2">DẤU HIỆU TÁCH BIỆT</text>
<text x="1220" y="300" fill="#f2f6fa" font-size="24" font-weight="650"><tspan x="1220" dy="0.0">K08: Lấn sang phần đường ngược</tspan><tspan x="1220" dy="32.4">chiều.</tspan></text>
<text x="1220" y="390" fill="#f2f6fa" font-size="24" font-weight="650"><tspan x="1220" dy="0.0">K09: Đi ngược chiều trên làn của</tspan><tspan x="1220" dy="32.4">người khác.</tspan></text>
<line x1="1220" y1="525" x2="1810" y2="525" stroke="#294158" stroke-width="2"/>
<text x="1220" y="574" fill="#ffb84d" font-size="25" font-weight="800">CÁCH PHÂN BIỆT</text>
<text x="1220" y="630" fill="#f2f6fa" font-size="25" font-weight="500"><tspan x="1220" dy="0.0">So sánh K08 và K09. Ở K08, nhìn</tspan><tspan x="1220" dy="35.0">thấy xe bắt đầu ở phần đường của</tspan><tspan x="1220" dy="35.0">mình rồi lấn qua ranh giới.</tspan></text>
<rect x="100" y="735" width="1000" height="190" rx="20" fill="#0b1724" stroke="#294158" stroke-width="2"/>
<text x="135" y="782" fill="#38d996" font-size="24" font-weight="800">THEO DÕI QUỸ ĐẠO QUA NHIỀU KHUNG HÌNH</text>
<g><circle cx="185" cy="843" r="23" fill="#58a6ff"/><text x="185" y="852" text-anchor="middle" fill="#122033" font-size="22" font-weight="900">1</text><text x="225" y="852" fill="#f2f6fa" font-size="25">Trước xung đột</text></g>
