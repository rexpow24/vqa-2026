<rect x="64" y="994" width="1792" height="54" rx="16" fill="#19354b"/>
<text x="94" y="1030" fill="#c8d8e8" font-size="22" font-weight="650">Chỉ mô tả chuyển động nhìn thấy. Nếu thiếu bối cảnh hoặc quỹ đạo, chọn “không rõ”.</text>
